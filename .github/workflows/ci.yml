name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # dist/ is checked in — this catches PRs that changed src/ but forgot
      # to rebuild the bundle.
      - name: Verify dist is fresh
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist/ is stale. Run 'npm run build' and commit."
            git diff dist
            exit 1
          fi

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: raven-actions/actionlint@v2
